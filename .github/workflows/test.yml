name: Test API

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devhub
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhub -d devhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/devhub
      DB_USERNAME: devhub
      DB_PASSWORD: devhub
      JWT_SECRET: test-only-secret-that-is-long-enough-for-hs256

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test
