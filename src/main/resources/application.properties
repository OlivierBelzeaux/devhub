spring.application.name=devhub

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devhub}
spring.datasource.username=${DB_USERNAME:devhub}
spring.datasource.password=${DB_PASSWORD:devhub}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoint.health.show-details=always

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.config.import=optional:file:.env[.properties]

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.token-lifetime=${JWT_TOKEN_LIFETIME:PT12H}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
