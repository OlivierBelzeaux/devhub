spring.application.name=devhub

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devhub}
spring.datasource.username=${DB_USERNAME:devhub}
spring.datasource.password=${DB_PASSWORD:devhub}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoint.health.show-details=always
